<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アノミー">
<meta name="theme-color" content="#1c2236">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>アノミー 卓上版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
/* 布マットの卓：上に月（180°回転）、中央に3×3盤、下に太陽。向かい合わせで1台のiPadを挟む */
:root{
  --mat:#1c2236; --mat-2:#242b44; --line:#3a4363; --ink:#ece8dc; --mute:#9aa1b8;
  --sun:#e3a93c; --sun-deep:#6b4614; --moon:#c3cbe2; --moon-deep:#2c3560;
  --red:#c4473b; --blue:#3b6fc2; --anomie:#7a58a6; --ok:#7fc29b;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--mat);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:radial-gradient(circle at 50% 50%,var(--mat-2),var(--mat) 70%)}
.app{height:100%;display:grid;grid-template-rows:1fr auto 1fr;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* ── プレイヤー欄 ── */
.panel{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:0;border-top:1px solid var(--line);padding-top:10px}
.panel.moon{transform:rotate(180deg)}
.panel.active{border-top-color:var(--pc)}
.panel.sun{--pc:var(--sun)} .panel.moon{--pc:var(--moon)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .emb{width:28px;height:28px}
.ph .nm{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.08em;color:var(--pc)}
.ph .st{font-size:14px;color:var(--mute)}
.panel.active .ph .st{color:var(--ink);font-weight:700}
.ph .cnt{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.msg{font-size:13px;color:var(--mute);min-height:1.3em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:64px}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:6px;font-size:15px;background:var(--mat-2)}
.btn.pri{background:var(--pc,var(--sun));color:#1a1d2b;border-color:transparent;font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:10px 14px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#1a1d2b;font-weight:700}
.aside{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.hidden-hand{display:flex;gap:6px}
.hb{width:28px;height:40px;border-radius:4px;background:var(--pd);border:1px solid var(--line)}
.panel.sun{--pd:var(--sun-deep)} .panel.moon{--pd:var(--moon-deep)}

/* ── 盤 ── */
.mid{display:flex;align-items:center;justify-content:center;gap:14px}
.side{width:76px;display:flex;flex-direction:column;align-items:center;gap:10px}
.side .lb{font-size:11px;color:var(--mute);letter-spacing:.1em;text-align:center}
.board{--s:min(calc(100vw - 220px),42vh,480px);width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:6px;background:var(--line);border-radius:4px}
.cell{position:relative;background:var(--mat);display:grid;place-items:center;padding:7%;perspective:600px}
.cell.legal::after{content:"";position:absolute;inset:6px;border:2px dashed var(--mute);border-radius:4px;opacity:.6;pointer-events:none}
.cell.affect::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none;z-index:2}
.cell.pend::after{border-style:solid;border-color:var(--ink);opacity:1}

/* ── タイル ── */
.tile{position:relative;width:100%;aspect-ratio:1;max-width:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.tile:not(.up){transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tile .b{transform:rotateY(180deg)}
.tile.red .f{background:var(--red)} .tile.blue .f{background:var(--blue)}
.tile.anomie .f{background:var(--anomie)}
.tile.anomie .b{background:#3a2c52;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 4px var(--anomie)}
.tile.anomie .b .ar{opacity:.45}
.tile.sun .b{background:var(--sun-deep)} .tile.moon .b{background:var(--moon-deep)}
.tile.sun .f{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 4px var(--sun)}
.tile.moon .f{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 4px var(--moon)}
.tile .ar{width:62%;height:62%}
.tile .cor{position:absolute;top:8%;left:8%;width:22%;height:22%}
.tile .big{width:55%;height:55%}
.tile.ghost{opacity:.6}
.htile{width:56px;height:56px;padding:0;border-radius:6px}
.htile .tile{width:56px}
.htile.sel{outline:3px solid var(--ink);outline-offset:3px}
.sm{width:28px} .sm .tile{width:28px}
.anbtn{width:64px;height:64px;padding:0;border-radius:6px}
.anbtn .tile{width:64px}
.anbtn.sel{outline:3px solid var(--ink);outline-offset:3px}
.anbtn:disabled{opacity:.25}
.slot{width:64px;height:64px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:11px;color:var(--mute)}
.ic{width:64px;height:44px;border:1px solid var(--line);border-radius:6px;font-size:12px;display:grid;place-items:center;background:var(--mat-2)}
.ic:disabled{opacity:.3}

/* ── オーバーレイ ── */
.ov{position:fixed;inset:0;background:rgba(14,17,28,.88);display:grid;place-items:center;z-index:20;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.setup{max-width:560px;width:100%;display:flex;flex-direction:column;gap:18px}
.setup h1{font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:.2em;margin:0;text-align:center}
.setup h1 small{display:block;font-size:14px;letter-spacing:.1em;color:var(--mute);font-family:var(--f-body);font-weight:400}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;color:var(--mute);letter-spacing:.05em}
.rules{font-size:14px;line-height:1.75;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
.rules ul{margin:0;padding-left:1.2em}
.rules .note{color:var(--mute);font-size:12.5px;margin-top:6px}
.end{display:grid;grid-template-rows:1fr auto 1fr;height:100%;width:100%;text-align:center}
.end .half{display:grid;place-items:center;font-family:var(--f-disp);font-size:clamp(28px,6vw,52px);font-weight:800;letter-spacing:.1em}
.end .half.top{transform:rotate(180deg)}
.end .half small{display:block;font-family:var(--f-body);font-size:15px;font-weight:400;color:var(--mute);letter-spacing:0}
.end .acts{display:flex;gap:12px;justify-content:center}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-width:520px){.side{width:56px}.board{--s:min(calc(100vw - 160px),40vh)}.anbtn,.anbtn .tile,.slot{width:52px;height:52px}.htile,.htile .tile{width:46px;height:46px}}
</style>

</head>
<body>
<div class="app" id="app">
  <section class="panel moon" id="p-moon"></section>
  <div class="mid">
    <div class="side">
      <button class="ic" data-act="undo" id="b-undo" aria-label="一手戻す">待った</button>
      <button class="ic" data-act="menu" aria-label="新しいゲーム">最初から</button>
      <button class="ic" id="b-fs" aria-label="全画面">全画面</button>
    </div>
    <div class="board" id="board" role="grid" aria-label="3×3の盤"></div>
    <div class="side">
      <div class="lb">アノミー</div>
      <div id="an"></div>
    </div>
  </div>
  <section class="panel sun" id="p-sun"></section>
</div>
<div class="ov" id="ov"></div>

<script>
const NAME={sun:'太陽',moon:'月'};
const OPP={sun:'moon',moon:'sun'};
const SVG={
  sun:'<svg viewBox="0 0 40 40" class="__C"><g stroke="currentColor" stroke-width="3" stroke-linecap="round">'+[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${20+13*Math.cos(r)}" y1="${20+13*Math.sin(r)}" x2="${20+18*Math.cos(r)}" y2="${20+18*Math.sin(r)}"/>`}).join('')+'</g><circle cx="20" cy="20" r="9" fill="currentColor"/></svg>',
  moon:'<svg viewBox="0 0 40 40" class="__C"><path d="M27 5a15 15 0 1 0 8 26A13 13 0 0 1 27 5z" fill="currentColor"/></svg>',
  v:'<svg viewBox="0 0 40 40" class="ar"><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="6" x2="20" y2="34"/><polyline points="12,13 20,5 28,13"/><polyline points="12,27 20,35 28,27"/></g></svg>',
  h:'<svg viewBox="0 0 40 40" class="ar"><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="34" y2="20"/><polyline points="13,12 5,20 13,28"/><polyline points="27,12 35,20 27,28"/></g></svg>',
  an:'<svg viewBox="0 0 40 40" class="ar"><g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><circle cx="20" cy="20" r="13"/><path d="M20 7a6.5 6.5 0 0 1 0 13a6.5 6.5 0 0 0 0 13"/></g><circle cx="20" cy="13.5" r="2.4" fill="#fff"/><circle cx="20" cy="26.5" r="2.4" fill="#1c2236"/></svg>'
};
const emb=(s,c)=>`<span style="color:var(--${s})">${SVG[s].replace('__C',c)}</span>`;

function tileHTML(t,up,extra=''){
  if(t.kind==='anomie') return `<div class="tile anomie ${up?'up':''} ${extra}"><div class="f">${SVG.an}</div><div class="b">${SVG.an}</div></div>`;
  return `<div class="tile ${t.owner} ${t.color} ${up?'up':''} ${extra}"><div class="f">${t.color==='red'?SVG.v:SVG.h}<span class="cor" style="color:${t.owner==='sun'?'var(--sun)':'var(--moon)'}">${SVG[t.owner].replace('__C','')}</span></div><div class="b">${emb(t.owner,'big')}</div></div>`;
}

const freshHand=p=>['red','red','red','blue','blue','blue'].map((c,i)=>({id:p+i,color:c,owner:p,kind:'tile'}));
let S;
function blank(opts){
  return {phase:'setup',opts:opts||{first:'sun',win:'color'},players:{sun:{hand:freshHand('sun'),aside:null},moon:{hand:freshHand('moon'),aside:null}},
    board:Array(9).fill(null),anomie:true,turn:'sun',asideP:'sun',sel:null,face:'up',dir:'col',pend:null,lastDown:{sun:null,moon:null},reveal:{sun:false,moon:false},hist:[],msg:'',winner:null};
}
const clone=o=>JSON.parse(JSON.stringify(o));

function legal(p){
  return S.board.map((c,i)=>(c===null||(c.kind==='tile'&&c.owner!==p&&!c.up))?i:-1).filter(i=>i>=0);
}
function selTile(){
  if(!S.sel) return null;
  if(S.sel==='anomie') return {kind:'anomie'};
  return S.players[S.turn].hand.find(t=>t.id===S.sel)||null;
}
const LINES={col:i=>[i%3,i%3+3,i%3+6],row:i=>{const r=Math.floor(i/3)*3;return[r,r+1,r+2]},d1:i=>[0,4,8].includes(i)?[0,4,8]:[],d2:i=>[2,4,6].includes(i)?[2,4,6]:[]};
const DIRNAME={col:'縦',row:'横',d1:'斜め＼',d2:'斜め／'};
function dirsAt(i){return Object.keys(LINES).filter(k=>LINES[k](i).length);}
function affected(i,t,up,dir){
  if(!up) return [];
  if(t.kind==='anomie'&&S.opts.an==='all') return S.board.map((c,j)=>c&&j!==i?j:-1).filter(j=>j>=0);
  const d=t.kind==='anomie'?(dirsAt(i).includes(dir)?dir:'col'):(t.color==='red'?'col':'row');
  return LINES[d](i).filter(j=>j!==i&&S.board[j]);
}
function canMove(p){ return (S.players[p].hand.length>0||S.anomie) && legal(p).length>0; }
function upCount(p,col){ return S.board.filter(c=>c&&c.kind==='tile'&&c.owner===p&&c.up&&(!col||c.color===col)).length; }
const won=p=>S.opts.win==='any'?upCount(p)>=3:(upCount(p,'red')>=3||upCount(p,'blue')>=3);
const upTxt=p=>`赤${upCount(p,'red')}・青${upCount(p,'blue')}`;

function commit(){
  const p=S.turn,t=selTile(),i=S.pend; if(!t||i===null) return;
  const snap=clone(S); delete snap.hist; S.hist.push(snap);
  const up=t.kind==='anomie'||S.face==='up';
  const aff=affected(i,t,up,S.dir);

  const under=S.board[i];
  if(under&&under.kind==='tile'){ S.players[under.owner].hand.push({id:under.id,color:under.color,owner:under.owner,kind:'tile'}); }
  if(t.kind==='anomie'){ S.anomie=false; S.board[i]={kind:'anomie',up,id:'anomie'}; }
  else { S.players[p].hand=S.players[p].hand.filter(x=>x.id!==t.id); S.board[i]={...t,up}; }
  let back=false;
  aff.forEach(j=>{const c=S.board[j]; if(c.kind==='anomie'){S.board[j]=null;S.anomie=true;back=true;} else c.up=!c.up;});
  const pos=['左上','上','右上','左','中央','右','左下','下','右下'][i];
  S.msg=`${NAME[p]}：${pos}に${t.kind==='anomie'?'アノミーを':''}${up?'表':'裏'}で置いた${t.kind==='anomie'&&up&&S.opts.an!=='all'?`（${DIRNAME[dirsAt(i).includes(S.dir)?S.dir:'col']}）`:''}`+(under?`（${NAME[under.owner]}のタイルを手札に戻す）`:'')+(aff.length?`／${aff.length}枚裏返し`:'')+(back?'／アノミーが盤外へ':'');
  S.sel=null;S.pend=null;S.face='up';S.dir='col';S.reveal={sun:false,moon:false};
  const a=won('sun'),b=won('moon');
  if(a||b){
    let w = a&&b ? 'draw' : (a?'sun':'moon');
    S.phase='over';S.winner=w;render();return;
  }
  S.turn=OPP[p];
  if(!canMove(S.turn)){
    if(canMove(p)){ S.msg+=`／${NAME[S.turn]}は置けないのでパス`; S.turn=p; }
    else { S.phase='over'; S.winner='draw'; }
  }
  render();
}

function act(a,arg){
  const p=S.turn;
  switch(a){
    case 'reveal': if((S.phase==='play'&&arg===p)||(S.phase==='aside'&&arg===S.asideP)) S.reveal[arg]=!S.reveal[arg]; if(!S.reveal[arg]&&S.sel!=='anomie'){S.sel=null;S.pend=null;} break;
    case 'pick': S.sel=arg; if(S.phase==='play'&&S.pend!==null&&!legal(p).includes(S.pend)) S.pend=null; break;
    case 'anomie': if(S.phase==='play'&&S.anomie){S.sel=S.sel==='anomie'?null:'anomie';} break;
    case 'face': S.face=arg; break;
    case 'dir': S.dir=arg; break;
    case 'cell': if(S.phase==='play'&&S.sel&&legal(p).includes(+arg)){ S.pend=+arg; if(!dirsAt(S.pend).includes(S.dir)) S.dir='col'; } break;
    case 'confirm':
      if(S.phase==='aside'&&S.sel){ const P=S.players[S.asideP]; const t=P.hand.find(x=>x.id===S.sel); P.aside=t; P.hand=P.hand.filter(x=>x!==t);
        S.sel=null; S.reveal={sun:false,moon:false};
        if(S.asideP===S.opts.first){S.asideP=OPP[S.asideP];} else {S.phase='play';S.turn=S.opts.first;S.msg=`${NAME[S.turn]}の先手で開始`;} }
      else if(S.phase==='play') { commit(); return; }
      break;
    case 'undo': if(S.hist.length){const h=S.hist.pop(); const keep=S.hist; S=h; S.hist=keep; S.msg='一手戻しました';} break;
    case 'menu': S.showMenu=true; break;
    case 'cancelmenu': S.showMenu=false; break;
    case 'start': {
      const first=document.getElementById('o-first').value, win='color', an='all';
      const f=first==='rand'?(Math.random()<.5?'sun':'moon'):first;
      S=blank({first:f,win,an,firstSel:first}); S.phase='aside'; S.asideP=f; resetBoardEls(); break; }
    case 'again': { const o=S.opts; const f=o.firstSel==='rand'?(Math.random()<.5?'sun':'moon'):o.first; S=blank({...o,first:f}); S.phase='aside'; S.asideP=f; resetBoardEls(); break; }
  }
  render();
}

document.getElementById('b-fs').addEventListener('click',()=>{
  const d=document, el=d.documentElement;
  const on=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req) throw 0;
    const r=req.call(el); if(r&&r.catch) r.catch(()=>{S.msg='この画面では全画面にできませんでした';render();});
  }catch(e){ S.msg='この画面では全画面にできませんでした'; render(); }
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; act(b.dataset.act,b.dataset.arg);});

/* 盤：セル要素を使い回し、同じタイルなら class の切替だけで裏返しアニメを出す */
const boardEl=document.getElementById('board'); const cells=[];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='cell';c.dataset.act='cell';c.dataset.arg=i;c.setAttribute('aria-label',`マス${i+1}`);boardEl.appendChild(c);cells.push(c);}
function resetBoardEls(){cells.forEach(c=>{c.dataset.key='';c.innerHTML='';});}

function renderBoard(){
  const p=S.turn,t=S.phase==='play'?selTile():null,L=t?legal(p):[];
  const up=t&&(t.kind==='anomie'||S.face==='up');
  const aff=(t&&S.pend!==null)?affected(S.pend,t,up,S.dir):[];
  cells.forEach((el,i)=>{
    const c=S.board[i]; let key='',html='';
    if(S.pend===i&&t){key='g:'+(t.id||'an')+up; html=tileHTML(t.kind==='anomie'?t:{...t,owner:p},up,'ghost');}
    else if(c){key=c.id; html=tileHTML(c,c.up);}
    if(el.dataset.key!==key){el.dataset.key=key;el.innerHTML=html;}
    else if(c&&S.pend!==i){const te=el.querySelector('.tile'); te&&te.classList.toggle('up',!!c.up);}
    el.classList.toggle('legal',L.includes(i));
    el.classList.toggle('pend',S.pend===i);
    el.classList.toggle('affect',aff.includes(i));
  });
}

function ctrls(s){
  const isAn=S.sel==='anomie';
  let h=`<div class="seg"><button data-act="face" data-arg="up" aria-pressed="${isAn||S.face==='up'}">表で置く</button><button data-act="face" data-arg="down" aria-pressed="${!isAn&&S.face==='down'}" ${isAn?'disabled':''}>裏で置く</button></div>`;
  if(isAn&&S.face==='up'&&S.opts.an!=='all'){ const ds=S.pend===null?['col','row','d1','d2']:dirsAt(S.pend);
    h+=`<div class="seg">${ds.map(d=>`<button data-act="dir" data-arg="${d}" aria-pressed="${S.dir===d}">${DIRNAME[d]}</button>`).join('')}</div>`; }
  h+=`<button class="btn pri" data-act="confirm" ${S.pend===null?'disabled':''}>${!S.sel?'タイルを選ぶ':S.pend===null?'置くマスをタップ':'ここに置く'}</button>`;
  return h;
}
function renderPanel(s){
  const el=document.getElementById('p-'+s),P=S.players[s];
  const mine=(S.phase==='play'&&S.turn===s)||(S.phase==='aside'&&S.asideP===s);
  el.classList.toggle('active',mine);
  let st='';
  if(S.phase==='aside') st= S.asideP===s?'除外する1枚を選ぶ':'相手が除外タイルを選択中';
  else if(S.phase==='play') st= S.turn===s?'あなたの番':'相手の番';
  let h=`<div class="ph">${emb(s,'emb')}<span class="nm">${NAME[s]}</span><span class="st">${st}</span><span class="cnt">表 ${upTxt(s)}（${S.opts.win==='any'?'計3':'同色3'}で勝ち）・ 手札 ${P.hand.length}枚</span></div>`;
  h+=`<div class="msg">${S.phase==='play'?S.msg:''}</div>`;
  const rev=S.reveal[s]&&mine;
  if(!rev){
    h+=`<div class="row"><div class="hidden-hand">${P.hand.map(()=>'<span class="hb"></span>').join('')}</div>`;
    if(mine) h+=`<button class="btn pri" data-act="reveal" data-arg="${s}">手札を見る</button>`;
    h+=`</div>`;
    if(mine&&S.phase==='play'&&S.sel==='anomie') h+=`<div class="row"><span class="st">アノミー：</span>${ctrls(s)}</div>`;
  } else {
    h+=`<div class="row"><div class="hand">${P.hand.map(t=>`<button class="htile ${S.sel===t.id?'sel':''}" data-act="pick" data-arg="${t.id}" aria-label="${t.color==='red'?'赤（縦）':'青（横）'}">${tileHTML(t,true)}</button>`).join('')}</div>`;
    if(P.aside) h+=`<span class="aside"><span class="sm">${tileHTML(P.aside,true)}</span>除外中</span>`;
    h+=`</div><div class="row">`;
    if(S.phase==='aside'){
      h+=`<button class="btn pri" data-act="confirm" ${S.sel?'':'disabled'}>この1枚を除外</button><button class="btn" data-act="reveal" data-arg="${s}">隠す</button>`;
    } else {
      h+=ctrls(s);
      h+=`<button class="btn" data-act="reveal" data-arg="${s}">隠す</button>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
}

function renderSide(){
  const an=document.getElementById('an');
  an.innerHTML=S.anomie?`<button class="anbtn ${S.sel==='anomie'?'sel':''}" data-act="anomie" ${S.phase!=='play'?'disabled':''} aria-label="アノミータイルを使う">${tileHTML({kind:'anomie'},true)}</button>`:`<div class="slot">盤上</div>`;
  document.getElementById('b-undo').disabled=!S.hist.length||S.phase==='setup';
}

function renderOv(){
  const ov=document.getElementById('ov');
  if(S.phase==='setup'||S.showMenu){
    const o=S.opts;
    ov.hidden=false;
    ov.innerHTML=`<div class="setup"><h1>アノミー<small>ANOMIE ・ 2人用 ・ ダイソー版ルール</small></h1>
      <label class="fld"><span>先手</span><select id="o-first" class="btn"><option value="sun" ${o.firstSel==='sun'||!o.firstSel?'selected':''}>太陽（手前）</option><option value="moon" ${o.firstSel==='moon'?'selected':''}>月（奥）</option><option value="rand" ${o.firstSel==='rand'?'selected':''}>ランダム</option></select></label>
      
      <div class="rules"><ul>
        <li>盤は3×3。各自6枚（赤3・青3）。開始前に1枚をこっそり除外</li>
        <li>空きマスか、相手の<b>裏向き</b>タイルの上に置く（下のタイルは相手の手札へ）</li>
        <li>表で置くと、<b>赤＝同じ縦列</b>、<b>青＝同じ横列</b>のタイルを端から端まで全部裏返す。裏で置くと何も起きない</li>
        <li>アノミーは場の横にある共有タイル。手札の代わりに置くと、<b>盤上の他のタイルを全部</b>裏返す</li>
        <li>裏返されて表になったタイルの効果は発動しない。アノミーが裏返されたら場の横に戻り、次の相手の手番からまた使える</li>
        <li>置けるマスか置けるタイルがなければパス</li>
        <li>どちらかの手番の終わりに、<b>自分の同じ色のタイル</b>（赤3枚か青3枚）が表向きなら勝ち。両者同時なら引き分け</li></ul>
        <div class="note">ダイソー版ルールブック準拠。</div></div>
      <div style="display:flex;gap:10px;justify-content:center"><button class="btn pri" data-act="start" style="--pc:var(--sun)">はじめる</button>${S.showMenu&&S.phase!=='setup'?'<button class="btn" data-act="cancelmenu">ゲームに戻る</button>':''}</div></div>`;
    return;
  }
  if(S.phase==='over'){
    ov.hidden=false;
    const txt=s=>S.winner==='draw'?'引き分け':(S.winner===s?'勝ち':'負け');
    ov.innerHTML=`<div class="end"><div class="half top"><div>${emb('moon','emb')} ${txt('moon')}<small>月 表 ${upTxt('moon')} ・ 太陽 表 ${upTxt('sun')}</small></div></div>
      <div class="acts"><button class="btn" data-act="undo">待った</button><button class="btn pri" data-act="again" style="--pc:var(--sun)">もう一度</button><button class="btn" data-act="menu">設定を変える</button></div>
      <div class="half"><div>${emb('sun','emb')} ${txt('sun')}<small>太陽 表 ${upTxt('sun')} ・ 月 表 ${upTxt('moon')}</small></div></div></div>`;
    ov.querySelectorAll('.emb').forEach(e=>{e.style.width='1em';e.style.height='1em';e.style.verticalAlign='-0.1em'});
    return;
  }
  ov.hidden=true; ov.innerHTML='';
}
function render(){ if(S.phase==='play'||S.phase==='over') S.showMenu=S.showMenu&&true; renderBoard();renderPanel('sun');renderPanel('moon');renderSide();renderOv(); }

function start(data){ S=(data&&data.S)?data.S:blank(); render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
